<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Lists</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 font-sans text-gray-800">

  <div class="max-w-3xl mx-auto py-10 px-6">
    <h1 class="text-3xl font-semibold text-center mb-6">📧 Manage Email Lists</h1>

    <!-- Create list form -->
    <div class="bg-white shadow rounded-2xl p-6 mb-8">
      <h2 class="text-xl font-medium mb-3">Create new list</h2>
      <div class="flex space-x-3">
        <input id="listName" type="text" placeholder="List name..."
               class="flex-grow border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-black">
        <button id="createListBtn" class="bg-black text-white px-5 py-2 rounded-lg hover:bg-gray-800">
          Create
        </button>
      </div>
      <p id="statusMsg" class="text-sm mt-3 text-gray-500"></p>
    </div>

    <!-- List container -->
    <div id="listContainer" class="space-y-3">
      {% for lista in listas %}
        <div class="bg-white shadow p-4 rounded-lg">
          <h3 class="text-lg font-medium">{{ lista.nombre }}</h3>
        </div>
      {% endfor %}
    </div>
  </div>

  <!-- JS -->
  <script>
  document.getElementById("createListBtn").addEventListener("click", async () => {
    const input = document.getElementById("listName");
    const status = document.getElementById("statusMsg");
    const name = input.value.trim();

    if (!name) {
      status.textContent = "⚠️ Please enter a name.";
      status.className = "text-sm mt-3 text-red-500";
      return;
    }

    status.textContent = "⏳ Creating list...";
    status.className = "text-sm mt-3 text-gray-500";

    try {
      const res = await fetch("/email_lists", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre: name })
      });

      const data = await res.json();
      if (data.ok) {
        status.textContent = "✅ List created!";
        status.className = "text-sm mt-3 text-green-600";

        // Add to DOM instantly
        const div = document.createElement("div");
        div.className = "bg-white shadow p-4 rounded-lg";
        div.innerHTML = `<h3 class="text-lg font-medium">${data.nombre}</h3>`;
        document.getElementById("listContainer").prepend(div);

        input.value = "";
      } else {
        status.textContent = "❌ " + (data.error || "Error creating list.");
        status.className = "text-sm mt-3 text-red-500";
      }
    } catch (err) {
      console.error(err);
      status.textContent = "❌ Connection error.";
      status.className = "text-sm mt-3 text-red-500";
    }
  });
  </script>

</body>
</html>
