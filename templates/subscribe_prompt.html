<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribe - Financial Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(145deg, #f8f9fb, #eceef1);
      color: #1c1c1e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background-color: #fff;
      border-radius: 1.25rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.12);
    }
    .btn-subscribe {
      background-color: #1c1c1e;
      color: white;
      border: 2px solid transparent;
      transition: all 0.25s ease;
    }
    .btn-subscribe:hover {
      background-color: #2d2d2f;
      border-color: #ff8c00;
      box-shadow: 0 0 10px rgba(255, 140, 0, 0.4);
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md p-10 card text-center">
    <h1 class="text-3xl font-semibold mb-4 tracking-tight">Subscribe to Access</h1>
    <p class="text-gray-600 mb-6 leading-relaxed">
      Unlock the <span class="font-semibold text-black">Financial Report Generator</span> 
      for just <span class="text-orange-500 font-medium">€10/month</span>.
    </p>

    <button id="checkout-button" class="btn-subscribe w-full py-3 px-4 text-lg font-medium rounded-lg">
      💳 Pay with Card
    </button>

    <div class="mt-6 text-gray-500 text-sm">
      Already have an account?
      <a href="/login" class="text-orange-600 hover:underline font-medium">Log In</a>
    </div>
  </div>

  <!-- ✅ Stripe official library -->
  <script src="https://js.stripe.com/v3/"></script>

  <!-- ✅ Stripe checkout handler -->
  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const stripe = Stripe("{{ publishable_key }}");

    document.getElementById("checkout-button").addEventListener("click", async () => {
      try {
        const response = await fetch("/create-checkout-session", { method: "POST" });
        const data = await response.json();

        if (data.id) {
          await stripe.redirectToCheckout({ sessionId: data.id });
        } else {
          alert("Error creating checkout session.");
        }
      } catch (err) {
        console.error(err);
        alert("Error communicating with server.");
      }
    });
  });
  </script>
</body>
</html>
